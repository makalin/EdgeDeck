; EdgeDeck — Cardputer ADV (ESP32-S3). Adjust when wiring the real M5 board profile.
[env:m5stack_cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5Cardputer.git
